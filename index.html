<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penguinify – turn any face into a penguin</title>
<meta name="description" content="Upload a photo or use your webcam. Faces are detected in your browser and swapped for penguins. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Penguinify</h1>
  <p>Drop in a photo. Every face becomes a penguin. It all runs in your browser, nothing gets uploaded.</p>
</header>

<section class="model" id="modelBar" data-state="needed">
  <div class="model-text"><strong id="modelTitle"></strong><span id="modelSub"></span></div>
  <div class="model-actions">
    <button class="btn primary small" id="modelDl" type="button">Download model</button>
    <label class="btn small" id="modelPick">Use my file<input id="modelFile" type="file" accept=".onnx" hidden></label>
    <button class="btn small" id="modelDel" type="button" hidden>Remove</button>
  </div>
  <div class="bar" id="modelProg" hidden><i></i></div>
</section>

<main class="layout">
  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <div class="drop-art" id="dropArt"></div>
      <h2>Drop a photo here</h2>
      <p>or paste one from your clipboard</p>
      <div class="row">
        <label class="btn primary">Choose a photo<input id="file" type="file" accept="image/*" hidden></label>
        <button class="btn" id="camBtn" type="button">Use webcam</button>
      </div>
      <button class="link" id="demoBtn" type="button">No photo? Start with a blank ice sheet</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap" hidden>
      <canvas id="canvas"></canvas>
      <div class="status" id="status" role="status"></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Penguin controls">
    <div class="group">
      <h3>Style</h3>
      <div class="chips" id="chips"></div>
    </div>

    <div class="group" id="selGroup">
      <h3>Selected penguin</h3>
      <p class="hint" id="selHint">Click a penguin on the photo to select it. Drag to move it.</p>
      <label class="slider">Size <input id="size" type="range" min="30" max="300" value="100"></label>
      <label class="slider">Tilt <input id="rot" type="range" min="-180" max="180" value="0"></label>
      <div class="row wrap">
        <button class="btn small" id="flip" type="button">Flip</button>
        <button class="btn small" id="del" type="button">Remove</button>
        <button class="btn small" id="useAll" type="button" title="Give every penguin this style">Use for all</button>
      </div>
    </div>

    <div class="group">
      <h3>Extras</h3>
      <div class="row wrap">
        <button class="btn small" id="deeper" type="button" title="Slower scan that finds tiny faces in group photos">Scan deeper</button>
        <button class="btn small" id="add" type="button">Add a penguin</button>
        <button class="btn small" id="shuffle" type="button" title="Re-deal a different penguin to every face">Shuffle</button>
        <button class="btn small" id="chaos" type="button">Chaos</button>
        <button class="btn small toggle" id="snow" type="button" aria-pressed="false">Snow</button>
        <button class="btn small toggle" id="fish" type="button" aria-pressed="false">Fish</button>
      </div>
    </div>

    <div class="group end">
      <button class="btn primary big" id="download" type="button" disabled>Download image</button>
      <button class="btn" id="another" type="button" disabled>Start over</button>
    </div>
  </aside>
</main>

<div class="modal" id="camModal" hidden>
  <div class="modal-card">
    <video id="video" playsinline muted></video>
    <div class="row">
      <button class="btn primary" id="snap" type="button">Take photo</button>
      <button class="btn" id="camClose" type="button">Cancel</button>
    </div>
    <p class="hint" id="camErr"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
